# config/localization/ayat_al_dayn_report.yaml
#
# Presentation-only localization for Ayat al-Dayn client reports.
# Controls CSV headers, enum value display, HTML section labels,
# and terminal output labels.
#
# Rules:
#   - No pipeline enums are mutated here.  These strings are display-only.
#   - Canonical identifiers (claim_key, evaluation_id, SHA digests,
#     slot_graph_digest, bridge_id, runtime_*_commit, runtime_vendor_sha)
#     map to themselves in every locale — they must never be translated.
#   - Arabic token surfaces, canonical roots, and internal JSON are excluded.
#   - Missing keys: translate_header / translate_value emit UserWarning and
#     fall back to the original key/value — never silently wrong.

